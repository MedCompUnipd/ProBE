[workspace]
name = "probe"
version = "0.1.0"
description = "Development environment for ProBE"
authors = ["ProBE contributors"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<3.14"
rdflib = ">=7,<8"
cmake = ">=3.20,<5"
ninja = ">=1.11,<2"
cxx-compiler = ">=1.7,<2"
zlib = ">=1.3,<2"
# Snakemake 9.27.0 requires packaging <26; avoid a conda/PyPI solve conflict.
packaging = ">=24,<26"

[pypi-dependencies]
probe-benchmark = { path = ".", editable = true }
snakemake = "==9.27.0"

[feature.dev.dependencies]
pytest = ">=8.4.2,<9"
ruff = ">=0.11,<1"

[environments]
default = ["dev"]

[tasks]
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
check = { depends-on = ["lint", "test"] }
build-release-fasta = "cmake -S cpp -B .pixi/build/probe-release-fasta -G Ninja && cmake --build .pixi/build/probe-release-fasta --target probe-release-fasta-v2"
release-fasta-v2 = ".pixi/build/probe-release-fasta/probe-release-fasta-v2"
build-goa-normalize = "cmake -S cpp -B .pixi/build/probe-goa-normalize -G Ninja && cmake --build .pixi/build/probe-goa-normalize --target probe-goa-normalize-v1"
goa-normalize-v1 = ".pixi/build/probe-goa-normalize/probe-goa-normalize-v1"
build-go-positive-filter = "cmake -S cpp -B .pixi/build/probe-go-positive-filter -G Ninja && cmake --build .pixi/build/probe-go-positive-filter --target probe-go-positive-filter-v1"
go-positive-filter-v1 = ".pixi/build/probe-go-positive-filter/probe-go-positive-filter-v1"
build-raw-ox-extract = "cmake -S cpp -B .pixi/build/probe-raw-ox-extract -G Ninja && cmake --build .pixi/build/probe-raw-ox-extract --target probe-raw-ox-extract-v1"
raw-ox-extract-v1 = ".pixi/build/probe-raw-ox-extract/probe-raw-ox-extract-v1"
