[workspace]
name = "probe"
version = "0.1.0"
description = "Development environment for ProBE"
authors = ["ProBE contributors"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.11,<3.14"
rdflib = ">=7,<8"

[pypi-dependencies]
probe-benchmark = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=8,<9"
ruff = ">=0.11,<1"

[environments]
default = { features = ["dev"], solve-group = "default" }

[tasks]
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
check = { depends-on = ["lint", "test"] }
