[workspace]
name = "probe"
version = "0.1.0"
description = "Development environment for ProBE"
authors = ["ProBE contributors"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<3.14"
rdflib = ">=7,<8"
pytest = ">=8.4.2,<9"
cmake = ">=3.20,<5"
ninja = ">=1.11,<2"
cxx-compiler = ">=1.7,<2"
zlib = ">=1.3,<2"

[pypi-dependencies]
probe-benchmark = { path = ".", editable = true }
pytest = "*"

[feature.dev.dependencies]
pytest = ">=8,<9"
ruff = ">=0.11,<1"

[environments]
default = ["dev"]

[tasks]
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
check = { depends-on = ["lint", "test"] }
build-release-fasta = "cmake -S cpp -B .pixi/build/probe-release-fasta -G Ninja && cmake --build .pixi/build/probe-release-fasta"
release-fasta-v2 = ".pixi/build/probe-release-fasta/probe-release-fasta-v2"
