[workspace]
name = "probe"
version = "0.1.0"
description = "Development environment for ProBE"
authors = ["ProBE contributors"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<3.14"
rdflib = ">=7,<8"
cmake = ">=3.20,<5"
ninja = ">=1.11,<2"
cxx-compiler = ">=1.7,<2"
zlib = ">=1.3,<2"
# Snakemake 9.27.0 requires packaging <26; avoid a conda/PyPI solve conflict.
packaging = ">=24,<26"

[pypi-dependencies]
probe-benchmark = { path = ".", editable = true }
snakemake = "==9.27.0"

[feature.dev.dependencies]
pytest = ">=8.4.2,<9"
ruff = ">=0.11,<1"

[environments]
default = ["dev"]

[tasks]
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
check = { depends-on = ["lint", "test"] }
build-release-fasta = "cmake -S cpp -B .pixi/build/probe-release-fasta -G Ninja && cmake --build .pixi/build/probe-release-fasta --target probe-release-fasta-v2"
release-fasta-v2 = ".pixi/build/probe-release-fasta/probe-release-fasta-v2"
build-goa-normalize = "cmake -S cpp -B .pixi/build/probe-goa-normalize -G Ninja && cmake --build .pixi/build/probe-goa-normalize --target probe-goa-normalize-v1"
goa-normalize-v1 = ".pixi/build/probe-goa-normalize/probe-goa-normalize-v1"
build-go-positive-filter = "cmake -S cpp -B .pixi/build/probe-go-positive-filter -G Ninja && cmake --build .pixi/build/probe-go-positive-filter --target probe-go-positive-filter-v1"
go-positive-filter-v1 = ".pixi/build/probe-go-positive-filter/probe-go-positive-filter-v1"
build-raw-ox-extract = "cmake -S cpp -B .pixi/build/probe-raw-ox-extract -G Ninja && cmake --build .pixi/build/probe-raw-ox-extract --target probe-raw-ox-extract-v1"
raw-ox-extract-v1 = ".pixi/build/probe-raw-ox-extract/probe-raw-ox-extract-v1"
build-primary-candidate-scan = "cmake -S cpp -B .pixi/build/probe-primary-candidate-scan -G Ninja && cmake --build .pixi/build/probe-primary-candidate-scan --target probe-primary-candidate-scan-v1"
primary-candidate-scan-v1 = ".pixi/build/probe-primary-candidate-scan/probe-primary-candidate-scan-v1"
build-primary-candidate-scan-v2 = "cmake -S cpp -B .pixi/build/probe-primary-candidate-scan-v2 -G Ninja && cmake --build .pixi/build/probe-primary-candidate-scan-v2 --target probe-primary-candidate-scan-v2"
primary-candidate-scan-v2 = ".pixi/build/probe-primary-candidate-scan-v2/probe-primary-candidate-scan-v2"
build-direct-accession-anchors = "cmake -S cpp -B .pixi/build/probe-direct-accession-anchors -G Ninja && cmake --build .pixi/build/probe-direct-accession-anchors --target probe-direct-accession-anchors-v1"
direct-accession-anchors-v1 = ".pixi/build/probe-direct-accession-anchors/probe-direct-accession-anchors-v1"
build-candidate-sequence-extract = "cmake -S cpp -B .pixi/build/probe-candidate-sequence-extract -G Ninja && cmake --build .pixi/build/probe-candidate-sequence-extract --target probe-candidate-sequence-extract-v1"
candidate-sequence-extract-v1 = ".pixi/build/probe-candidate-sequence-extract/probe-candidate-sequence-extract-v1"
build-onehop-lineage-scan = "cmake -S cpp -B .pixi/build/probe-onehop-lineage-scan -G Ninja && cmake --build .pixi/build/probe-onehop-lineage-scan --target probe-onehop-lineage-scan-v1"
onehop-lineage-scan-v1 = ".pixi/build/probe-onehop-lineage-scan/probe-onehop-lineage-scan-v1"
build-directional-glocal-full-dp = "cmake -S cpp -B .pixi/build/probe-directional-glocal-full-dp -G Ninja && cmake --build .pixi/build/probe-directional-glocal-full-dp --target probe-directional-glocal-full-dp-v1"
directional-glocal-full-dp-v1 = ".pixi/build/probe-directional-glocal-full-dp/probe-directional-glocal-full-dp-v1"

build-full-exact-cross-strain = "cmake -S cpp -B .pixi/build/probe-full-exact-cross-strain -G Ninja && cmake --build .pixi/build/probe-full-exact-cross-strain --target probe-full-exact-cross-strain-v1"
full-exact-cross-strain-v1 = ".pixi/build/probe-full-exact-cross-strain/probe-full-exact-cross-strain-v1"
